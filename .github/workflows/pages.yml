name: Deploy demo pages

on:
  push:
    branches: [main]
  # Runs main's copy of this workflow when a fix PR is opened or updated, so
  # fix branches don't need their own copy. Safe here: the build only copies
  # HTML out of git and never runs code from the pull request.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # Checks out main with all branches, not the pull request's code.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build one folder per branch
        run: bash .github/scripts/build-pages.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
